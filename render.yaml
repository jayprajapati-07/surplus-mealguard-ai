services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma + Supabase)
  # -------------------------------------------------------------
  - type: web
    name: mealguard-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: your Supabase PostgreSQL connection string
      - key: CLIENT_ORIGIN
        sync: false # Set to your frontend Render URL or '*'
      - key: SESSION_TTL_HOURS
        value: 72
      - key: RATE_LIMIT_AUTH_MAX
        value: 5000
      - key: SUPABASE_URL
        value: https://xewlimzaswophixqwogi.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_gEDnnWdnBAbokI1-LA_TCg_MR6uPfKT

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: static
    name: mealguard-web
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<your-backend-service-name>.onrender.com/api
      - key: VITE_SUPABASE_URL
        value: https://xewlimzaswophixqwogi.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_gEDnnWdnBAbokI1-LA_TCg_MR6uPfKT
