services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma + Supabase)
  # -------------------------------------------------------------
  - type: web
    name: mealguard-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase POOLED connection string (Supavisor, ap-south-1)
      - key: CLIENT_ORIGIN
        sync: false # Set to your exact frontend URL, e.g. https://mealguard-web.onrender.com (no '*', no trailing slash)
      - key: SESSION_TTL_HOURS
        value: 72
      - key: RATE_LIMIT_AUTH_MAX
        value: 30
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard: Supabase project URL (optional)
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard: Supabase publishable/anon key (optional)
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard: Gemini API key for Excel understanding + explanations
      - key: RESEND_API_KEY
        sync: false # Set in Render Dashboard: Resend API key for NGO distribution email
      - key: RESEND_FROM
        sync: false # Set in Render Dashboard: verified sender, e.g. noreply@yourdomain.org
      - key: EOD_TIMEZONE
        value: Asia/Kolkata # IANA zone for the 10 PM auto-report; change to your hotel's zone

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: static
    name: mealguard-web
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<your-backend-service-name>.onrender.com/api
      - key: VITE_SUPABASE_URL
        sync: false # Optional: Supabase project URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Optional: Supabase publishable/anon key
